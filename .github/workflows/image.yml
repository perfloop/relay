name: Image

# Builds and publishes the relay image. A pull request build proves the
# Dockerfile still builds; a push to main publishes the image tagged with the
# commit it was built from (the short and the full SHA), so an image is always
# traceable to one commit of this repository. There is no scheduled or manual
# publish: one main-branch build is the sole publisher for a tag.
#
# Auth is Workload Identity Federation from this repository's main branch to
# a push-only service account in the registry project. No long-lived key is
# held anywhere.

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  # A pull request's newer push replaces its older build. Main groups include
  # the SHA, so one commit cannot cancel another commit's publication.
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-{1}', github.workflow, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # WIF on main; a pull request never publishes
    env:
      IMAGE: us-central1-docker.pkg.dev/perfloop-public-prod/perfloop-images/relay
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - id: tags
        name: Compute tags
        run: |
          set -euo pipefail
          short_sha="$(git rev-parse --short HEAD)"
          full_sha="$(git rev-parse --verify 'HEAD^{commit}')"
          [[ "$full_sha" =~ ^[0-9a-f]{40}$ ]]
          {
            echo "tags<<EOF"
            echo "${IMAGE}:${short_sha}"
            if [ "${PUBLISH}" = "true" ]; then
              echo "${IMAGE}:${full_sha}"
            fi
            echo "EOF"
          } >>"$GITHUB_OUTPUT"

      - if: env.PUBLISH == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: perfloop-image-pusher@perfloop-public-prod.iam.gserviceaccount.com

      - if: env.PUBLISH == 'true'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db

      - if: env.PUBLISH == 'true'
        name: Configure docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5

      - id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.tags.outputs.tags }}
          # A published image carries a pinned Syft SPDX package inventory.
          sbom: ${{ env.PUBLISH == 'true' && 'generator=docker/buildkit-syft-scanner@sha256:79e7b013cbec16bbb436f312819a49a4a57752b2270c1a9332ae1a10fcc82a68' || 'false' }}

      - if: env.PUBLISH == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - if: env.PUBLISH == 'true'
        name: Sign the published digest
        # Keyless: the signing identity is this workflow's OIDC token, so a
        # verifier can require exactly this repository, workflow, and branch
        # (docs/image.md). No signing key exists.
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - if: env.PUBLISH == 'true'
        name: Report digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          {
            echo "## Relay image published"
            echo
            echo "Tags:"
            echo
            while IFS= read -r tag; do
              [ -n "${tag}" ] || continue
              printf -- '- %s\n' "${tag}"
            done <<<"${TAGS}"
            echo
            echo "Manifest digest:"
            echo
            echo '```'
            echo "${IMAGE}@${DIGEST}"
            echo '```'
            echo
            echo "Signed with keyless cosign by this workflow's identity (docs/image.md)."
            echo
            echo "Customers pull this image by digest; publish the new digest in the relay guide when it changes."
          } >>"$GITHUB_STEP_SUMMARY"
