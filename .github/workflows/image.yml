name: Image

# Builds the relay image on every pull request and publishes it on every push
# to main, to ghcr.io/perfloop/relay, tagged with the commit it was built from
# (the short and the full SHA), signed with keyless cosign, with an SBOM
# attached. The two are separate jobs so a pull request build runs with
# read-only permissions: only the main-branch job can write a package or
# obtain an OIDC token. There is no scheduled or manual publish.
#
# The registry credential is the workflow's own GITHUB_TOKEN; the signing
# identity is the workflow's OIDC token. No long-lived key is held anywhere.

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  # A pull request's newer push replaces its older build. Main groups include
  # the SHA, so one commit cannot cancel another commit's publication.
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-{1}', github.workflow, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    # A pull request proves the Dockerfile still builds. Nothing is pushed.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5
      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # ghcr.io/perfloop/relay
      id-token: write # keyless cosign
    env:
      IMAGE: ghcr.io/perfloop/relay
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - id: tags
        name: Compute tags
        run: |
          set -euo pipefail
          short_sha="$(git rev-parse --short HEAD)"
          full_sha="$(git rev-parse --verify 'HEAD^{commit}')"
          [[ "$full_sha" =~ ^[0-9a-f]{40}$ ]]
          {
            echo "tags<<EOF"
            echo "${IMAGE}:${short_sha}"
            echo "${IMAGE}:${full_sha}"
            echo "EOF"
          } >>"$GITHUB_OUTPUT"

      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5

      - id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # A published image carries a pinned Syft SPDX package inventory.
          sbom: generator=docker/buildkit-syft-scanner@sha256:79e7b013cbec16bbb436f312819a49a4a57752b2270c1a9332ae1a10fcc82a68

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Sign the published digest
        # Keyless: the signing identity is this workflow's OIDC token, so a
        # verifier can require exactly this repository, workflow, and branch
        # (docs/image.md). No signing key exists.
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Report digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          {
            echo "## Relay image published"
            echo
            echo "Tags:"
            echo
            while IFS= read -r tag; do
              [ -n "${tag}" ] || continue
              printf -- '- %s\n' "${tag}"
            done <<<"${TAGS}"
            echo
            echo "Manifest digest:"
            echo
            echo '```'
            echo "${IMAGE}@${DIGEST}"
            echo '```'
            echo
            echo "Signed with keyless cosign by this workflow's identity (docs/image.md)."
            echo
            echo "Customers pull this image by digest; publish the new digest in the relay guide when it changes."
          } >>"$GITHUB_STEP_SUMMARY"
